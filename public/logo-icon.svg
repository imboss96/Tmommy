  <!-- Central Warm Coral Heart -->
  <path d="M 245 490
           C 240 485, 178 438, 178 395
           C 178 368, 198 350, 224 350
           C 238 350, 248 358, 254 368
           C 260 358, 270 350, 284 350
           C 310 350, 330 368, 330 395
