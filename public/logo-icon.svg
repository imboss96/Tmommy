             C 214 366, 185 366, 170 382
             C 148 406, 148 446, 168 478
             C 186 508, 218 528, 256 534
             C 220 534, 180 520, 152 494
             C 124 466, 118 426, 134 386
             C 144 360, 160 338, 172 318 Z" />
